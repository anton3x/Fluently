pre-commit:
  parallel: true
  commands:
    format-and-lint:
      glob: "*.{js,ts,jsx,tsx,json,css,md,yml,yaml}"
      run: |
        bunx prettier --write {staged_files}
        bunx eslint --fix {staged_files}
      stage_fixed: true

    typecheck:
      run: bun run typecheck

pre-push:
  parallel: true
  commands:
    test:
      run: bun run test
